<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <meta name="description" content="Araya Basecamp Extensions - Track time and sync to Google Sheets">
  <title>Araya Basecamp Extensions</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="header-logo">
          <svg class="header-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <div class="header-text">
            <h1 class="header-title">Araya Basecamp Extensions</h1>
            <span class="header-subtitle">for Basecamp</span>
          </div>
        </div>
        <span class="header-version" id="versionBadge">v1.0.0</span>
      </div>
    </header>

    <!-- Connection Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Checking...</span>
    </div>

    <!-- Summary Cards -->
    <section class="summary-section">
      <div class="summary-card summary-card--today" id="todayCard">
        <div class="summary-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="summary-data">
          <span class="summary-value" id="todayHours">0.0</span>
          <span class="summary-label">Hours Today</span>
        </div>
      </div>
      <div class="summary-card summary-card--week" id="weekCard">
        <div class="summary-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <div class="summary-data">
          <span class="summary-value" id="weekHours">0.0</span>
          <span class="summary-label">Hours This Week</span>
        </div>
      </div>
    </section>

    <!-- Recent Entries -->
    <section class="recent-section">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Recent Entries
      </h2>
      <div class="entries-list" id="entriesList">
        <div class="entries-empty" id="entriesEmpty">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <p>No time entries yet</p>
          <span>Start tracking time on Basecamp tasks</span>
        </div>
        <!-- Entries will be populated by JS -->
      </div>
    </section>

    <!-- Settings Section -->
    <section class="settings-section">
      <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
        <span class="settings-toggle-text">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </span>
        <svg class="settings-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <div class="settings-panel" id="settingsPanel" aria-hidden="true">
        <div class="settings-content">
          <!-- User Name -->
          <div class="form-group">
            <label class="form-label" for="userName">
              User Name
              <span class="form-hint">Auto-detected from Basecamp</span>
            </label>
            <input
              type="text"
              class="form-input"
              id="userName"
              placeholder="e.g., John Doe"
              autocomplete="name"
            >
          </div>

          <!-- Apps Script URL -->
          <div class="form-group">
            <label class="form-label" for="appsScriptUrl">
              Apps Script URL
              <span class="form-hint">Your deployed web app URL</span>
            </label>
            <input
              type="url"
              class="form-input"
              id="appsScriptUrl"
              placeholder="https://script.google.com/macros/s/..."
              autocomplete="url"
            >
          </div>

          <!-- API Key -->
          <div class="form-group">
            <label class="form-label" for="apiKey">
              API Key
              <span class="form-hint">From Apps Script properties</span>
            </label>
            <input
              type="password"
              class="form-input"
              id="apiKey"
              placeholder="Your secret API key"
              autocomplete="off"
            >
          </div>

          <!-- Theme -->
          <div class="form-group">
            <label class="form-label" for="themeSelect">
              Theme
            </label>
            <select class="form-input" id="themeSelect">
              <option value="system">System Default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <!-- Action Buttons -->
          <div class="form-actions">
            <button type="button" class="btn btn--outline" id="testConnectionBtn">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
              <span class="btn-label">Test Connection</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn btn--primary" id="saveSettingsBtn">
              <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              Save Settings
            </button>
          </div>

          <!-- Connection Test Result -->
          <div class="test-result" id="testResult" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="alert" aria-live="assertive">
      <span class="toast-icon" id="toastIcon"></span>
      <span class="toast-message" id="toastMessage"></span>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button type="button" class="footer-link" id="openSpreadsheetBtn" title="Open Google Sheets timesheet">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open Spreadsheet
      </button>
      <span class="footer-meta">Araya Basecamp Extensions</span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
